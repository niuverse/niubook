name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install CJK fonts
        timeout-minutes: 10
        run: |
          sudo mkdir -p /usr/share/fonts/truetype/noto-cjk
          base="https://raw.githubusercontent.com/notofonts/noto-cjk/main"
          for f in \
            "Serif/OTF/SimplifiedChinese/NotoSerifCJKsc-Regular.otf" \
            "Serif/OTF/SimplifiedChinese/NotoSerifCJKsc-Bold.otf" \
            "Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Bold.otf" \
            "Sans/Mono/NotoSansMonoCJKsc-Regular.otf" \
            "Sans/Mono/NotoSansMonoCJKsc-Bold.otf"; do
            sudo curl -L --fail --retry 3 --silent --show-error \
              -o "/usr/share/fonts/truetype/noto-cjk/$(basename "$f")" "$base/$f"
          done
          sudo fc-cache -f

      - name: Install pinned Typst
        run: python3 scripts/bootstrap.py

      - name: Doctor
        run: python3 scripts/doctor.py

      - name: Quality gates
        run: python3 scripts/check.py --all

      - name: Build books
        run: python3 scripts/build.py

      - name: Build site
        run: python3 scripts/site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
