name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk poppler-utils

      - name: Install pinned Typst
        run: python3 scripts/bootstrap.py

      - name: Doctor
        run: python3 scripts/doctor.py

      - name: Quality gates
        run: python3 scripts/check.py --all

      - name: Build books
        run: python3 scripts/build.py

      - name: Build site
        run: python3 scripts/site.py
