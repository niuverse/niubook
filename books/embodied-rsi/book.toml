abstract = """
本书把「具身递归自我改进」作为独立研究纲领来处理：从 Agent = 模型 + Harness 的分层出发，用扩展五元组统一形式化改进闭环，系统梳理 2025–2026 年的 Harness 工程、自我修改机制、评估协议与物理域证据，并给出可运行的参考实现与验证清单。全书坚持一条判据：瓶颈不在系统能否自我改进，而在我们能否可信地断言它改进了。"""
